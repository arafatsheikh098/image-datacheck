name: pages

# Publishes a sample report to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow only one concurrent deploy; cancel in-progress runs on new push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build sample report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Build sample report
        run: |
          mkdir -p .site
          python examples/make_demo_dataset.py examples/demo
          imagedatacheck report examples/demo \
            --html .site/index.html \
            --json .site/report.json \
            --thumbnails 12 \
            --fail-on never \
            --quiet

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
